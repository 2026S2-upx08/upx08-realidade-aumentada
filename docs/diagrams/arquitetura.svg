<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 730" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333" />
    </marker>
  </defs>

  <rect x="0" y="0" width="420" height="730" fill="#ffffff" />

  <!-- Usuário -->
  <rect x="60" y="10" width="300" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5" />
  <text x="210" y="45" text-anchor="middle" font-size="16">Usuário</text>

  <line x1="210" y1="70" x2="210" y2="104" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Aplicação -->
  <rect x="60" y="110" width="300" height="70" rx="8" fill="#e8f0fe" stroke="#333" stroke-width="1.5" />
  <text x="210" y="138" text-anchor="middle" font-size="16">Aplicação (React + Vite)</text>
  <text x="210" y="158" text-anchor="middle" font-size="12" fill="#555">máquina de estados de sessão</text>

  <line x1="210" y1="180" x2="210" y2="214" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Interface -->
  <rect x="60" y="220" width="300" height="70" rx="8" fill="#e8f0fe" stroke="#333" stroke-width="1.5" />
  <text x="210" y="248" text-anchor="middle" font-size="16">Interface</text>
  <text x="210" y="268" text-anchor="middle" font-size="12" fill="#555">início, lista de estruturas, modo RA/2D</text>

  <line x1="210" y1="290" x2="210" y2="324" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Módulo de RA -->
  <rect x="60" y="330" width="300" height="70" rx="8" fill="#fef3e0" stroke="#333" stroke-width="1.5" />
  <text x="210" y="358" text-anchor="middle" font-size="16">Módulo de RA</text>
  <text x="210" y="378" text-anchor="middle" font-size="12" fill="#555">react-three-fiber + @react-three/xr</text>

  <line x1="210" y1="400" x2="210" y2="434" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- WebXR Device API -->
  <rect x="60" y="440" width="300" height="70" rx="8" fill="#fef3e0" stroke="#333" stroke-width="1.5" />
  <text x="210" y="468" text-anchor="middle" font-size="16">WebXR Device API</text>
  <text x="210" y="488" text-anchor="middle" font-size="12" fill="#555">sessão immersive-ar, hit-test, dom overlay</text>

  <line x1="210" y1="510" x2="210" y2="544" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ARCore -->
  <rect x="60" y="550" width="300" height="60" rx="8" fill="#fde8e8" stroke="#333" stroke-width="1.5" />
  <text x="210" y="585" text-anchor="middle" font-size="16">ARCore (navegador Android)</text>

  <line x1="210" y1="610" x2="210" y2="644" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Câmera e sensores -->
  <rect x="60" y="650" width="300" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5" />
  <text x="210" y="685" text-anchor="middle" font-size="16">Câmera e sensores do dispositivo</text>
</svg>
